<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 智瞳 AI智能安防监控系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A1120; --panel: #101B30; --card: #121E36;
      --line: rgba(148,178,224,.10); --line-strong: rgba(148,178,224,.18);
      --text: #E8F0FB; --text-2: #B7C6DF; --muted: #8CA2C3;
      --cyan: #2AD6FF; --cyan-deep: #0FB5DF; --cyan-dim: rgba(42,214,255,.10);
      --purple: #8B7CFF; --green: #3DDC97; --yellow: #FFC53D; --red: #FF5D5D;
      --font-ui: "Inter","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
      --font-mono: "JetBrains Mono","SFMono-Regular",Consolas,"Courier New",monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-ui); color: var(--text); font-size: 13px;
      background: var(--bg); -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: var(--font-mono); }
    ::selection { background: rgba(42,214,255,.25); }

    /* 全屏背景 + 遮罩 */
    .auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      background: url("/img/login-bg.png") center / cover no-repeat;
      position: relative;
    }
    .auth-wrap::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(900px 520px at 50% 20%, rgba(10,17,32,.20), transparent 60%),
        linear-gradient(180deg, rgba(4,9,18,.55) 0%, rgba(4,9,18,.78) 100%);
      backdrop-filter: blur(2px);
    }

    /* 登录卡片 */
    .auth-card {
      position: relative; z-index: 2; width: 400px; max-width: calc(100vw - 40px);
      background: rgba(18,30,54,.92);
      border: 1px solid rgba(148,178,224,.16);
      border-radius: 16px; padding: 34px 34px 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .logo-badge {
      width: 44px; height: 44px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, var(--cyan-dim), rgba(139,124,255,.14));
      border: 1px solid rgba(42,214,255,.35);
      display: grid; place-items: center;
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: .2px; }
    .brand-en {
      font-family: var(--font-mono); font-size: 9px; color: var(--muted);
      letter-spacing: 1.5px; margin-top: 3px; text-transform: uppercase;
    }
    .brand-grad { background: linear-gradient(90deg, var(--cyan), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* Tab 切换 */
    .tabs { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; margin-bottom: 22px; }
    .tab {
      flex: 1; height: 38px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
      color: var(--muted); transition: all .18s;
      display: grid; place-items: center;
    }
    .tab.active { background: var(--cyan-dim); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(42,214,255,.30); }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
    .field label .opt { color: var(--muted); opacity: .7; }
    .input {
      width: 100%; height: 44px; padding: 0 13px;
      background: var(--bg); border: 1px solid var(--line-strong); border-radius: 9px;
      color: var(--text); font-size: 13.5px; transition: border .15s, box-shadow .15s;
    }
    .input::placeholder { color: #5B6B85; }
    .input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(42,214,255,.12); outline: none; }

    .submit {
      width: 100%; height: 46px; margin-top: 6px; border-radius: 10px;
      font-size: 14.5px; font-weight: 700; color: #04121F; cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      border: none; transition: transform .12s, box-shadow .18s, opacity .15s;
      box-shadow: 0 10px 26px rgba(15,181,223,.28);
    }
    .submit:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(15,181,223,.38); }
    .submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .msg { min-height: 18px; font-size: 12px; margin: 4px 0 10px; padding-left: 2px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }

    /* 默认账号提示（在登录/注册按钮下方、底部链接之上） */
    .hint {
      margin-top: 14px; padding: 10px 12px; border-radius: 8px;
      background: rgba(42,214,255,.06); border: 1px dashed rgba(42,214,255,.28);
      font-size: 12px; color: var(--text-2); line-height: 1.7;
    }
    .hint .lbl { color: var(--cyan); font-weight: 700; margin-right: 6px; }
    .hint code {
      font-family: var(--font-mono); color: #FFE082; background: rgba(0,0,0,.35);
      padding: 1px 6px; border-radius: 4px; margin: 0 2px;
    }

    .foot { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 20px; }
    .foot a { color: var(--cyan); cursor: pointer; }
    .foot a:hover { text-decoration: underline; }

    .form-pane { display: none; }
    .form-pane.active { display: block; }
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="gS" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#2AD6FF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient></defs>
          <path d="M12 1.8 3.8 4.9v6.3c0 5.2 3.5 9.8 8.2 11.2 4.7-1.4 8.2-6 8.2-11.2V4.9L12 1.8z" fill="url(#gS)"/>
          <ellipse cx="12" cy="10.6" rx="3.7" ry="2.7" fill="#0A1120"/>
          <circle cx="12" cy="10.6" r="1.5" fill="#7BE4FF"/>
          <path d="M8.3 15.6l2-1.7M15.7 15.6l-2-1.7" stroke="#0A1120" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-title"><span class="brand-grad">智瞳</span> · AI智能安防监控系统</div>
        <div class="brand-en">ZHITONG · AI SECURITY MONITOR</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">登录</button>
      <button class="tab" id="tabRegister" type="button">注册</button>
    </div>

    <div class="msg" id="authMsg"></div>

    <!-- 登录 -->
    <form class="form-pane active" id="loginPane" novalidate>
      <div class="field">
        <label>用户名</label>
        <input class="input" id="loginUser" type="text" placeholder="请输入用户名" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" id="loginPass" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button class="submit" id="loginBtn" type="submit">登 录</button>
      <div class="hint">
        <span class="lbl">默认账号</span>
        用户名 <code>admin</code> · 密码 <code>admin123</code>
        <div style="color:var(--muted); margin-top:3px; font-size:11.5px;">首次使用？建议先点下方"立即注册"创建自己的账号</div>
      </div>
      <div class="foot">还没有账号？<a id="goRegister">立即注册</a></div>
    </form>

    <!-- 注册 -->
    <form class="form-pane" id="registerPane" novalidate>
      <div class="field">
        <label>用户名</label>
        <input class="input" id="regUser" type="text" placeholder="2-32 个字符" autocomplete="username">
      </div>
      <div class="field">
        <label>昵称 <span class="opt">（选填）</span></label>
        <input class="input" id="regNick" type="text" placeholder="展示用昵称" autocomplete="nickname">
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" id="regPass" type="password" placeholder="至少 4 位" autocomplete="new-password">
      </div>
      <div class="field">
        <label>确认密码</label>
        <input class="input" id="regPass2" type="password" placeholder="再次输入密码" autocomplete="new-password">
      </div>
      <button class="submit" id="regBtn" type="submit">注 册</button>
      <div class="hint">
        <span class="lbl">提示</span>
        注册成功后将自动登录进入系统；用户名 2-32 位，密码至少 4 位
      </div>
      <div class="foot">已有账号？<a id="goLogin">返回登录</a></div>
    </form>
  </div>
</div>

<script>
(function () {
  "use strict";
  var msg = document.getElementById("authMsg");
  var tabLogin = document.getElementById("tabLogin");
  var tabReg = document.getElementById("tabRegister");
  var loginPane = document.getElementById("loginPane");
  var regPane = document.getElementById("registerPane");

  function show(tab) {
    var isLogin = tab === "login";
    tabLogin.classList.toggle("active", isLogin);
    tabReg.classList.toggle("active", !isLogin);
    loginPane.classList.toggle("active", isLogin);
    regPane.classList.toggle("active", !isLogin);
    setMsg("");
  }
  tabLogin.addEventListener("click", function () { show("login"); });
  tabReg.addEventListener("click", function () { show("register"); });
  document.getElementById("goRegister").addEventListener("click", function () { show("register"); });
  document.getElementById("goLogin").addEventListener("click", function () { show("login"); });

  function setMsg(t, type) {
    msg.textContent = t || "";
    msg.className = "msg" + (type ? " " + type : "");
  }

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.msg || "请求失败(" + r.status + ")");
        return d;
      });
    });
  }

  function goApp() { window.location.href = "index.html"; }

  // 登录
  document.getElementById("loginPane").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("loginUser").value.trim();
    var p = document.getElementById("loginPass").value;
    if (!u || !p) { setMsg("请输入用户名和密码", "err"); return; }
    var btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "登录中…"; setMsg("");
    post("/api/auth/login", { username: u, password: p })
      .then(function (d) { goApp(); })
      .catch(function (err) { setMsg(err.message || "登录失败", "err"); btn.disabled = false; btn.textContent = "登 录"; });
  });

  // 注册
  document.getElementById("registerPane").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("regUser").value.trim();
    var nick = document.getElementById("regNick").value.trim();
    var p = document.getElementById("regPass").value;
    var p2 = document.getElementById("regPass2").value;
    if (!u || !p) { setMsg("请输入用户名和密码", "err"); return; }
    if (p.length < 4) { setMsg("密码长度不能少于 4 位", "err"); return; }
    if (p !== p2) { setMsg("两次输入的密码不一致", "err"); return; }
    var btn = document.getElementById("regBtn");
    btn.disabled = true; btn.textContent = "注册中…"; setMsg("");
    post("/api/auth/register", { username: u, password: p, nickname: nick })
      .then(function (d) { setMsg("注册成功，正在进入系统…", "ok"); setTimeout(goApp, 500); })
      .catch(function (err) { setMsg(err.message || "注册失败", "err"); btn.disabled = false; btn.textContent = "注 册"; });
  });
})();
</script>
</body>
</html>
