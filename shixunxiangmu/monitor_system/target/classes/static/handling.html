<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>告警处置记录 · 智瞳 AI智能安防监控系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* 处置记录摘要行：补左侧内边距（h-summary 原样式右侧 16px、左侧 0） */
    .h-item .h-summary { padding-left: 16px; }
    /* 批量导出：默认隐藏勾选框，进入选择模式（.select-mode）后显示 */
    .handle-list:not(.select-mode) .h-check { display: none; }
    .handle-list.select-mode .h-check {
      width: 15px; height: 15px; margin: 0 2px 0 0;
      accent-color: #2AD6FF; cursor: pointer; flex: none;
    }
  </style>
</head>
<body>
<div class="frame">

  <!-- ================= 顶栏 ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gShieldTop" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2AD6FF"/><stop offset="1" stop-color="#8B7CFF"/>
            </linearGradient>
          </defs>
          <path d="M12 1.8 3.8 4.9v6.3c0 5.2 3.5 9.8 8.2 11.2 4.7-1.4 8.2-6 8.2-11.2V4.9L12 1.8z" fill="url(#gShieldTop)"/>
          <ellipse cx="12" cy="10.6" rx="3.7" ry="2.7" fill="#0A1120"/>
          <circle cx="12" cy="10.6" r="1.5" fill="#7BE4FF"/>
          <path d="M8.3 15.6l2-1.7M15.7 15.6l-2-1.7" stroke="#0A1120" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-title">智瞳 · AI智能安防监控系统<span class="en">ZHITONG · AI SECURITY MONITOR</span></div>
    </div>
    <div class="top-right">
      <div class="sys-time"><span id="sysTime">--:--:--</span><span class="date" id="sysDate">----</span></div>
      <button class="bell-btn" title="告警通知">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/>
          <path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>
        </svg>
      </button>
      <div class="avatar-chip">
        <div class="avatar">管</div>
        <div class="who">管理员<span class="role">超级管理员</span></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- ================= 侧栏 ================= -->
    <aside class="sidebar">
      <nav class="side-nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
          </svg>
          监控大屏
        </a>
        <a class="nav-item" href="devices.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5 21.5 7.2v9.6l-6-3.3"/>
          </svg>
          设备信息
        </a>
        <a class="nav-item" href="records.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/>
          </svg>
          AI识别记录
        </a>
        <a class="nav-item" href="alarms.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>
          </svg>
          实时告警中心
        </a>
        <a class="nav-item active" href="handling.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="2.8" width="6" height="3.4" rx="1.2"/>
            <path d="M9 13.5l2.2 2.2 4-4.4"/>
          </svg>
          告警处置记录
        </a>
      </nav>

      </aside>

    <!-- ================= 主内容 ================= -->
    <main class="main">
      <div class="content">

        <!-- 页头 -->
        <div class="page-header">
          <div class="page-title">告警处置记录</div>
          <div class="tools">
            <div class="date-range">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
              <input type="date" id="handDateFrom">
              <span class="sep">至</span>
              <input type="date" id="handDateTo">
            </div>
            <div class="pill-group" id="handPills">
              <button class="pill active">全部</button>
              <button class="pill">已完成</button>
              <button class="pill">已忽略</button>
              <button class="pill">误报</button>
            </div>
            <div class="search-box" style="min-width:200px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="text" id="handSearch" placeholder="关键字搜索">
            </div>
            <button class="btn btn-primary" id="btnHandExport" title="勾选处置记录，批量导出为 .dat 文件">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>
              导出记录
            </button>
            <button class="btn btn-ghost" id="btnHandCheckAll" style="display:none;" title="全选 / 取消全选当前列表">全选</button>
            <button class="btn btn-ghost" id="btnHandCancelExport" style="display:none;" title="取消导出，收起复选框">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
              取消
            </button>
            <button class="btn btn-primary" id="btnHandConfirmExport" style="display:none; opacity:.45;" disabled title="导出勾选的处置记录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 7l5-5 5 5M4 19h16"/></svg>
              确认导出
            </button>
          </div>
        </div>

        <!-- 处置统计 KPI -->
        <div class="kpi-row">
          <div class="kpi" style="--kpi-accent:#2AD6FF; --kpi-dim:var(--cyan-dim)">
            <div class="kpi-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2"/><rect x="9" y="2.8" width="6" height="3.4" rx="1.2"/><path d="M9 13.5l2.2 2.2 4-4.4"/></svg>
              今日处置
            </div>
            <div class="kpi-value" id="kpiToday">0<span class="unit">单</span></div>
            <div class="kpi-foot">平均响应 <span class="mono" id="kpiAvgCost">--</span> 分钟</div>
            <div class="kpi-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </div>
          </div>
          <div class="kpi" style="--kpi-accent:#FFC53D; --kpi-dim:var(--yellow-dim)">
            <div class="kpi-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              待复核
            </div>
            <div class="kpi-value" id="kpiReview">0<span class="unit">单</span></div>
            <div class="kpi-foot">复核超时将自动升级</div>
            <div class="kpi-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </div>
          </div>
          <div class="kpi" style="--kpi-accent:#8B7CFF; --kpi-dim:rgba(139,124,255,.12)">
            <div class="kpi-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c2-8 14-8 16 0"/><path d="M4 16a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM16 16a2 2 0 1 0 4 0 2 2 0 0 0-4 0z"/></svg>
              误报率
            </div>
            <div class="kpi-value" id="kpiFalseRate">0<span class="unit">%</span></div>
            <div class="kpi-foot">误报 <span class="mono" id="kpiFalseCnt">0</span> / 处置 <span class="mono" id="kpiTotalCnt">0</span> 单</div>
            <div class="kpi-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
            </div>
          </div>
          <div class="kpi accent-red">
            <div class="kpi-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2.5h6"/></svg>
              超时处置
            </div>
            <div class="kpi-value" id="kpiTimeout">0<span class="unit">单</span></div>
            <div class="kpi-foot">超过 <span class="mono">30</span> 分钟未完成</div>
            <div class="kpi-icon" style="--kpi-accent:var(--red); --kpi-dim:var(--red-dim)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.8 19.5h18.4L12 4z"/><path d="M12 10v4.2M12 17h.01"/></svg>
            </div>
          </div>
        </div>

        <!-- 处置流程列表 -->
        <div class="handle-list">
          <div class="empty-state" style="min-height:280px;">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/></svg>
            <span class="es-title">暂无处置记录</span>
            <span class="es-sub">在实时告警中心点击「处置」按钮，将在此生成记录</span>
          </div>
        </div>

        <!-- 底部分页 -->
        <div class="pager" style="margin-top:16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);">
          <span class="page-info">共 <span class="mono" id="handPagerTotal">0</span> 条处置记录</span>
          <button class="pg" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
          </button>
          <button class="pg active">1</button>
          <button class="pg" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg>
          </button>
        </div>

      </div>
    </main>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
</body>
</html>
