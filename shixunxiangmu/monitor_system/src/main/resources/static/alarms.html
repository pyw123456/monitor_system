<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时告警中心 · 智瞳 AI智能安防监控系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="frame">

  <!-- ================= 顶栏 ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gShieldTop" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#2AD6FF"/><stop offset="1" stop-color="#8B7CFF"/>
            </linearGradient>
          </defs>
          <path d="M12 1.8 3.8 4.9v6.3c0 5.2 3.5 9.8 8.2 11.2 4.7-1.4 8.2-6 8.2-11.2V4.9L12 1.8z" fill="url(#gShieldTop)"/>
          <ellipse cx="12" cy="10.6" rx="3.7" ry="2.7" fill="#0A1120"/>
          <circle cx="12" cy="10.6" r="1.5" fill="#7BE4FF"/>
          <path d="M8.3 15.6l2-1.7M15.7 15.6l-2-1.7" stroke="#0A1120" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="logo-title">智瞳 · AI智能安防监控系统<span class="en">ZHITONG · AI SECURITY MONITOR</span></div>
    </div>
    <div class="top-right">
      <div class="sys-time"><span id="sysTime">--:--:--</span><span class="date" id="sysDate">----</span></div>
      <button class="bell-btn" title="告警通知">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/>
          <path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>
        </svg>
      </button>
      <div class="avatar-chip">
        <div class="avatar">管</div>
        <div class="who">管理员<span class="role">超级管理员</span></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- ================= 侧栏 ================= -->
    <aside class="sidebar">
      <nav class="side-nav">
        <a class="nav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
          </svg>
          监控大屏
        </a>
        <a class="nav-item" href="devices.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5 21.5 7.2v9.6l-6-3.3"/>
          </svg>
          设备信息
        </a>
        <a class="nav-item" href="records.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/>
          </svg>
          AI识别记录
        </a>
        <a class="nav-item active" href="alarms.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>
          </svg>
          实时告警中心
        </a>
        <a class="nav-item" href="handling.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2"/>
            <rect x="9" y="2.8" width="6" height="3.4" rx="1.2"/>
            <path d="M9 13.5l2.2 2.2 4-4.4"/>
          </svg>
          告警处置记录
        </a>
      </nav>

      </aside>

    <!-- ================= 主内容 ================= -->
    <main class="main">
      <div class="content">

        <!-- 页头 -->
        <div class="page-header">
          <div class="page-title">实时告警中心</div>
          <div class="tools">
            <span class="live-pill red"><span class="pulse"></span>实时监听中</span>
            <div class="pill-group">
              <button class="pill active">全部 <span class="num null-val">Null</span></button>
              <button class="pill">紧急 <span class="num null-val">Null</span></button>
              <button class="pill">警告 <span class="num null-val">Null</span></button>
              <button class="pill">提示 <span class="num null-val">Null</span></button>
            </div>
            <button class="icon-btn on" id="soundToggle" title="告警声音开关">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 5 6.5 8.5H3.5v7h3L11 19V5z"/>
                <path d="M15 9.5a4 4 0 0 1 0 5M17.5 7a7.5 7.5 0 0 1 0 10"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="alarm-center">

          <!-- ============ 左侧：告警主列表（2/3） ============ -->
          <div class="ac-list">
            <div class="empty-state" style="min-height:340px;">
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.2 2 6.2H4S6 14 6 9z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/></svg>
              <span class="es-title">暂无告警记录</span>
              <span class="es-sub">数据待接入</span>
            </div>
          </div>

          <!-- ============ 右侧栏（1/3） ============ -->
          <div class="ac-aside">

            <!-- 今日告警统计 -->
            <div class="card">
              <div class="card-head">
                <span class="card-title">今日告警统计</span>
                <span class="sub">更新于 <span class="mono null-val">--:--</span></span>
              </div>
              <div class="mini-donut-wrap">
                <svg width="110" height="110" viewBox="0 0 110 110">
                  <g transform="rotate(-90 55 55)">
                    <circle cx="55" cy="55" r="38" fill="none" stroke="#16233C" stroke-width="13"/>
                  </g>
                  <text x="55" y="53" text-anchor="middle" fill="#E8F0FB"
                        font-family="'JetBrains Mono',monospace" font-size="17" font-weight="800">Null</text>
                  <text x="55" y="66" text-anchor="middle" fill="#8CA2C3" font-size="8">今日告警</text>
                </svg>
                <div class="mini-legend">
                  <span class="lg"><i style="background:#FF5D5D"></i>紧急<span class="mono null-val">Null</span></span>
                  <span class="lg"><i style="background:#FFC53D"></i>警告<span class="mono null-val">Null</span></span>
                  <span class="lg"><i style="background:#2AD6FF"></i>提示<span class="mono null-val">Null</span></span>
                </div>
              </div>
            </div>

            <!-- 值班人员 -->
            <div class="card duty-card">
              <div class="avatar-lg">--</div>
              <div>
                <div class="d-name null-val">Null</div>
                <div class="d-role null-val">Null · 今日 --:-- - --:--</div>
              </div>
              <div class="d-tel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
                </svg>
                <span class="null-val">Null</span>
              </div>
            </div>

            <!-- 最新紧急告警 -->
            <div class="latest-critical" style="background:var(--white-2, rgba(255,255,255,0.015)); border-color:var(--line);">
              <div class="lc-label" style="color:var(--muted);">
                最新紧急告警
              </div>
              <div class="lc-title null-val" style="color:var(--muted);">Null</div>
              <div class="lc-meta">
                <span class="null-val">Null</span>
                <span class="mono null-val">--:--:--</span>
                <span>置信度 <span class="mono null-val">Null</span></span>
              </div>
              <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
                <span class="status-pill gray">Null</span>
              </div>
            </div>

          </div>
        </div>

      </div>
    </main>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
</body>
</html>
